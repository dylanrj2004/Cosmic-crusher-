<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cosmic Crusher">
<meta name="mobile-web-app-capable" content="yes">
<title>Cosmic Crusher</title>
<meta name="cosmic-crusher-build" content="firebase-leaderboard-2026-09-27">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  background:#0a0a1a;
  font-family:-apple-system,'Segoe UI',Arial,sans-serif;
  overflow:hidden;
  -webkit-user-select:none;
  user-select:none;
  color:#fff;
  height:100%;width:100%;
  min-height:100dvh;
  overscroll-behavior:none;
  -webkit-touch-callout:none;
  position:fixed;top:0;left:0;
}
#start-screen{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:radial-gradient(ellipse at center,#1a1040 0%,#0a0a1a 70%);
  z-index:200;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;
  padding:20px;
  padding-top:env(safe-area-inset-top,20px);
  padding-bottom:env(safe-area-inset-bottom,20px);
  touch-action:manipulation;
}
#start-screen h1{
  font-size:clamp(32px,8vw,56px);color:#00e5ff;
  text-shadow:0 0 40px rgba(0,200,255,0.6),0 0 80px rgba(0,200,255,0.3);
  letter-spacing:4px;text-align:center;
}
#start-screen p{
  color:#8888bb;font-size:clamp(14px,3.5vw,16px);
  max-width:400px;text-align:center;line-height:1.6;
}
.build-tag{
  color:#66eaff;font-size:11px;letter-spacing:2px;text-transform:uppercase;
  opacity:.82;text-align:center;
}
#player-name{
  width:min(320px,90vw);padding:13px 16px;border-radius:14px;
  border:1px solid rgba(0,200,255,0.45);background:rgba(0,0,0,0.35);
  color:#fff;font-size:16px;text-align:center;outline:none;
  box-shadow:0 0 18px rgba(0,180,255,0.12);
}
#player-name::placeholder{color:#7777aa}
#start-btn{
  background:linear-gradient(135deg,#00aaff,#0066cc);
  border:none;border-radius:30px;padding:18px 55px;
  color:#fff;font-size:20px;font-weight:bold;
  cursor:pointer;letter-spacing:3px;
  box-shadow:0 0 30px rgba(0,150,255,0.4);
  min-height:54px;
  touch-action:manipulation;
  -webkit-appearance:none;
  position:relative;
  z-index:210;
}
#start-btn:active{transform:scale(0.95);box-shadow:0 0 50px rgba(0,150,255,0.6)}

#game-container{display:none;height:100dvh;width:100%;position:relative}
@media(min-width:769px){
  #game-container{display:none;flex-direction:row}
  #shop-panel{width:280px;border-left:2px solid rgba(0,200,255,0.2)}
  #shop-toggle{display:none!important}
}
@media(max-width:768px){
  #game-container{flex-direction:column}
  #shop-panel{
    position:fixed;bottom:0;left:0;right:0;height:55vh;
    border-top:2px solid rgba(0,200,255,0.4);border-left:none;
    transform:translateY(100%);transition:transform 0.3s ease;
    z-index:50;border-radius:20px 20px 0 0;
    padding-bottom:env(safe-area-inset-bottom,20px);
  }
  #shop-panel.open{transform:translateY(0)}
  #shop-toggle{
    display:flex!important;position:fixed;
    bottom:calc(12px + env(safe-area-inset-bottom,0px));right:12px;
    z-index:40;width:56px;height:56px;border-radius:50%;
    background:linear-gradient(135deg,#2a1a5e,#4a2a8e);
    border:2px solid rgba(100,80,200,0.6);color:#fff;font-size:24px;
    align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 0 20px rgba(100,80,200,0.4);
    touch-action:manipulation;
  }
  #shop-toggle:active{transform:scale(0.9)}
  .hud-item{font-size:12px!important;padding:5px 10px!important}
  #combo-display{font-size:22px!important}
  #wave-announce{font-size:32px!important}
}
#game-area{
  flex:1;position:relative;overflow:hidden;
  cursor:crosshair;min-width:0;min-height:0;
  touch-action:none;
}
canvas{position:absolute;top:0;left:0;width:100%;height:100%}
#bgCanvas{z-index:0}
#gameCanvas{z-index:1}
#hud{
  position:absolute;
  top:calc(10px + env(safe-area-inset-top,0px));
  left:calc(10px + env(safe-area-inset-left,0px));
  z-index:10;display:flex;flex-direction:column;gap:5px;
  pointer-events:none;
}
.hud-item{
  background:rgba(0,0,0,0.75);border:1px solid rgba(0,200,255,0.3);
  border-radius:8px;padding:6px 14px;font-size:14px;color:#00e5ff;
  text-shadow:0 0 8px rgba(0,200,255,0.5);
  -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);
}
.hud-item span{color:#fff;font-weight:bold}
#wave-progress-wrap{
  width:170px;height:10px;margin-top:5px;
  border:1px solid rgba(0,200,255,0.35);border-radius:999px;
  background:rgba(0,0,0,0.45);overflow:hidden;
}
#wave-progress-fill{
  width:0%;height:100%;
  background:linear-gradient(90deg,#00e5ff,#ff66cc);
  box-shadow:0 0 12px rgba(0,229,255,0.7);
  transition:width 0.2s ease;
}
#wave-progress-text{display:block;margin-top:4px;font-size:11px;color:#aeefff}
#combo-display{
  position:absolute;
  top:calc(10px + env(safe-area-inset-top,0px));
  left:50%;transform:translateX(-50%);z-index:10;
  font-size:28px;font-weight:bold;color:#ff6600;
  text-shadow:0 0 20px rgba(255,100,0,0.8);
  opacity:0;transition:opacity 0.3s;pointer-events:none;
}
#combo-display.active{opacity:1}
#wave-announce{
  position:absolute;top:45%;left:50%;
  transform:translate(-50%,-50%);z-index:15;
  font-size:42px;font-weight:bold;color:#ff3366;
  text-shadow:0 0 30px rgba(255,50,100,0.8);
  opacity:0;pointer-events:none;transition:opacity 0.5s;
  text-align:center;white-space:nowrap;
}
#shop-panel{
  background:linear-gradient(180deg,#0d1025 0%,#1a1040 100%);
  padding:15px;overflow-y:auto;-webkit-overflow-scrolling:touch;
  z-index:50;display:flex;flex-direction:column;gap:8px;
  touch-action:pan-y;
}
#shop-panel h2{
  color:#00e5ff;font-size:18px;text-align:center;margin-bottom:5px;
  text-shadow:0 0 10px rgba(0,200,255,0.5);letter-spacing:3px;
}
.panel-box{
  border:1px solid rgba(0,200,255,0.25);border-radius:10px;
  background:rgba(0,0,0,0.22);padding:10px;
}
.panel-title{font-size:12px;color:#66eaff;letter-spacing:2px;text-align:center}
.leaderboard-box{padding:0;overflow:hidden}
.leaderboard-toggle{
  width:100%;border:0;background:rgba(0,0,0,0.18);color:#fff;
  display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;
  padding:10px;cursor:pointer;touch-action:manipulation;
}
.leaderboard-badge{
  font-size:10px;color:#ffcc00;border:1px solid rgba(255,204,0,0.35);
  border-radius:999px;padding:3px 7px;letter-spacing:1px;
}
.leaderboard-arrow{color:#66eaff;font-size:13px}
.leaderboard-menu{display:none;padding:0 10px 10px 10px}
.leaderboard-menu.open{display:block}
.leaderboard-controls{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-bottom:7px}
.leaderboard-control{
  border:1px solid rgba(0,200,255,0.28);background:rgba(0,0,0,0.28);
  color:#9eefff;border-radius:8px;padding:7px 8px;font-size:11px;
  cursor:pointer;touch-action:manipulation;
}
.leaderboard-control.active{background:rgba(0,200,255,0.18);color:#fff;border-color:rgba(0,200,255,0.7)}
.leaderboard-status{min-height:15px;font-size:10px;color:#8888aa;text-align:center;margin-bottom:6px}
#leaderboard-list{display:flex;flex-direction:column;gap:5px;font-size:12px;color:#ddd}
.leader-row{display:grid;grid-template-columns:22px 1fr auto;gap:6px;align-items:center}
.leader-name{color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leader-score{color:#ffcc00;text-align:right;font-size:11px}
#shop-handle{display:none;width:40px;height:5px;background:rgba(255,255,255,0.3);border-radius:3px;margin:0 auto 8px auto}
@media(max-width:768px){#shop-handle{display:block}}
.upgrade-btn{
  background:linear-gradient(135deg,#1a1a3e,#2a1a4e);
  border:1px solid rgba(100,80,200,0.4);border-radius:12px;
  padding:12px 14px;color:#fff;cursor:pointer;
  transition:all 0.15s;text-align:left;min-height:44px;
  position:relative;touch-action:manipulation;
}
.upgrade-btn:active:not(.disabled){
  transform:scale(0.97);
  background:linear-gradient(135deg,#3a3a6e,#4a3a7e);
}
.upgrade-btn.disabled{opacity:0.4;cursor:not-allowed}
.upgrade-name{font-weight:bold;font-size:14px;color:#c8b8ff}
.upgrade-desc{font-size:12px;color:#8888aa;margin-top:3px}
.upgrade-cost{font-size:13px;color:#ffcc00;margin-top:5px}
.upgrade-level{font-size:12px;color:#66ff88;position:absolute;top:12px;right:14px}
#prestige-section{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,100,200,0.3)}
#prestige-btn{
  background:linear-gradient(135deg,#4a0030,#6a0050);
  border:1px solid rgba(255,100,200,0.5);width:100%;
  border-radius:12px;padding:14px;color:#ff66cc;cursor:pointer;
  font-size:15px;font-weight:bold;
  text-shadow:0 0 10px rgba(255,100,200,0.5);
  min-height:44px;touch-action:manipulation;
}
#prestige-btn:active{transform:scale(0.97);background:linear-gradient(135deg,#6a0050,#8a0070)}
.click-text{
  position:absolute;pointer-events:none;z-index:10;
  font-weight:bold;font-size:20px;animation:floatUp 0.7s forwards;
}
@keyframes floatUp{
  0%{opacity:1;transform:translateY(0) scale(1)}
  100%{opacity:0;transform:translateY(-50px) scale(1.4)}
}
#shop-backdrop{
  display:none;position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.5);z-index:45;
}
#shop-backdrop.active{display:block}
</style>
</head>
<body>

<div id="start-screen">
  <h1>COSMIC CRUSHER</h1>
  <p>Asteroids rain from the sky! Tap to destroy them, earn credits, and upgrade your arsenal.</p>
  <div class="build-tag">Firebase leaderboard build</div>
  <input id="player-name" maxlength="18" autocomplete="off" placeholder="ENTER YOUR NAME">
  <button id="start-btn" type="button">LAUNCH</button>
</div>

<div id="game-container">
  <div id="game-area">
    <canvas id="bgCanvas"></canvas>
    <canvas id="gameCanvas"></canvas>
    <div id="hud">
      <div class="hud-item">Credits: <span id="credits">0</span></div>
      <div class="hud-item">Total: <span id="total-credits">0</span></div>
      <div class="hud-item">DPS: <span id="dps">0</span>/s</div>
      <div class="hud-item">Wave: <span id="wave">1</span></div>
      <div class="hud-item">Level: <span id="wave-progress-text">0 / 10</span><div id="wave-progress-wrap"><div id="wave-progress-fill"></div></div></div>
      <div class="hud-item">Destroyed: <span id="destroyed">0</span></div>
    </div>
    <div id="combo-display">COMBO x1</div>
    <div id="wave-announce"></div>
  </div>
  <div id="shop-backdrop"></div>
  <button id="shop-toggle" style="display:none;">&#9881;</button>
  <div id="shop-panel">
    <div id="shop-handle"></div>
    <h2>UPGRADES</h2>
    <div class="panel-box leaderboard-box">
      <button id="leaderboard-toggle" class="leaderboard-toggle" type="button" aria-expanded="true">
        <span id="leaderboard-title" class="panel-title">LOCAL LEADERBOARD</span>
        <span id="leaderboard-source-badge" class="leaderboard-badge">LOCAL</span>
        <span id="leaderboard-arrow" class="leaderboard-arrow">&#9662;</span>
      </button>
      <div id="leaderboard-menu" class="leaderboard-menu open">
        <div class="leaderboard-controls">
          <button id="leaderboard-global" class="leaderboard-control" type="button">GLOBAL</button>
          <button id="leaderboard-local" class="leaderboard-control active" type="button">LOCAL</button>
          <button id="leaderboard-refresh" class="leaderboard-control" type="button">&#8635;</button>
        </div>
        <div id="leaderboard-status" class="leaderboard-status">Local scores saved on this device</div>
        <div id="leaderboard-list"></div>
      </div>
    </div>
    <div id="upgrade-list"></div>
    <div id="prestige-section">
      <button id="prestige-btn" type="button">PRESTIGE<br><span style="font-size:12px;color:#cc88aa;">Reset for permanent multiplier</span></button>
      <div style="text-align:center;margin-top:6px;font-size:12px;color:#aa6688;" id="prestige-info">Requires 10,000 total credits</div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // iPhone/iOS-safe button wiring: one pointer event per physical press.
  function wireStartButton(){
    var btn = document.getElementById('start-btn');
    if(!btn) return;

    btn.addEventListener('pointerdown', function(){
      btn.style.transform = 'scale(0.95)';
    }, {passive:true});

    btn.addEventListener('pointerup', function(e){
      btn.style.transform = '';
      launchGame(e);
    }, {passive:false});

    btn.addEventListener('pointercancel', function(){
      btn.style.transform = '';
    }, {passive:true});
  }

  // STATE
  var credits = 0, totalCredits = 0, totalDestroyed = 0;
  var clickDamage = 1, creditMultiplier = 1, autoDP = 0;
  var bossDamageMultiplier = 1, waveCreditBonus = 1;
  var combo = 0, comboTimer = null;
  var wave = 1, waveProgress = 0, waveTarget = 10;
  var prestigeLevel = 0, prestigeMultiplier = 1;
  var gameRunning = false, shopOpen = false;
  var objects = [], particles = [], stars = [];
  var bgCanvas, bgCtx, gameCanvas, gameCtx;
  var canvasW = 300, canvasH = 500, dpr = 1;
  var launched = false;
  var turboMode = /[?&](turbo|codexTurbo)=1(?:&|$)/.test(window.location.search);
  var playerName = 'Pilot';

  var upgrades = [
    {id:'click',name:'Click Power',desc:'Increase tap damage',baseCost:10,costMult:1.5,level:0,effect:function(){clickDamage+=1}},
    {id:'auto',name:'Auto Laser',desc:'Auto-damages objects each second',baseCost:50,costMult:1.6,level:0,effect:function(){autoDP+=1}},
    {id:'crit',name:'Critical Strike',desc:'Chance for 5x tap damage',baseCost:100,costMult:1.8,level:0,maxLevel:20,effect:function(){}},
    {id:'multi',name:'Credit Boost',desc:'Multiply all credits earned',baseCost:200,costMult:2.0,level:0,effect:function(){creditMultiplier+=0.25}},
    {id:'magnet',name:'Credit Magnet',desc:'Bonus credits from destroyed objects',baseCost:150,costMult:1.7,level:0,effect:function(){}},
    {id:'chain',name:'Chain Reaction',desc:'Destroyed objects damage nearby ones',baseCost:300,costMult:2.0,level:0,maxLevel:10,effect:function(){}},
    {id:'speed',name:'Slow Field',desc:'Slows down scrolling objects',baseCost:250,costMult:1.8,level:0,maxLevel:10,effect:function(){}},
    {id:'size',name:'Big Targets',desc:'Objects spawn larger (easier to tap)',baseCost:75,costMult:1.5,level:0,maxLevel:10,effect:function(){}},
    {id:'boss',name:'Boss Breaker',desc:'Prestige 1: extra damage to bosses',baseCost:5000,costMult:1.9,level:0,minPrestige:1,maxLevel:25,effect:function(){bossDamageMultiplier+=0.35}},
    {id:'overclock',name:'Overclock Laser',desc:'Prestige 2: +3 auto DPS per level',baseCost:15000,costMult:1.85,level:0,minPrestige:2,maxLevel:30,effect:function(){autoDP+=3}},
    {id:'surge',name:'Credit Surge',desc:'Prestige 3: bigger credit multiplier',baseCost:50000,costMult:2.05,level:0,minPrestige:3,maxLevel:30,effect:function(){creditMultiplier+=0.5}},
    {id:'crusher',name:'Crusher Core',desc:'Prestige 4: massive tap damage boost',baseCost:150000,costMult:2.0,level:0,minPrestige:4,maxLevel:25,effect:function(){clickDamage+=5}},
    {id:'wavepay',name:'Wave Bounty',desc:'Prestige 5: more credits on higher waves',baseCost:500000,costMult:2.1,level:0,minPrestige:5,maxLevel:25,effect:function(){waveCreditBonus+=0.08}}
  ];

  function getCost(u){return Math.floor(u.baseCost*Math.pow(u.costMult,u.level))}
  function formatNum(n){
    if(n>=1e9)return(n/1e9).toFixed(1)+'B';
    if(n>=1e6)return(n/1e6).toFixed(1)+'M';
    if(n>=1e3)return(n/1e3).toFixed(1)+'K';
    return ''+n;
  }
  function getPrestigeRequirement(){
    return Math.floor(10000*Math.pow(1.7,prestigeLevel));
  }
  function cleanName(name){
    name=String(name||'').trim().replace(/\s+/g,' ');
    return name ? name.slice(0,18) : 'Pilot';
  }

  // SAVE SYSTEM V3
  // ONE-TIME FRESH START:
  // On the first launch of this build, wipe the old V2/V3 saves, then keep saving normally.
  var SAVE_KEY='cosmicCrusherSaveV3';
  var LEGACY_SAVE_KEY='cosmicCrusherSaveV2';
  var PROFILE_KEY='cosmicCrusherPlayerProfileV1';
  var LEADERBOARD_KEY='cosmicCrusherLocalLeaderboardV1';
  var DEVICE_ID_KEY='cosmicCrusherDeviceIdV1';
  var RESET_MARKER='cosmicCrusherFreshReset_2026_09_26_v1';

  try{
    if(!localStorage.getItem(RESET_MARKER)){
      localStorage.removeItem(SAVE_KEY);
      localStorage.removeItem(LEGACY_SAVE_KEY);
      localStorage.setItem(RESET_MARKER,'done');
    }
  }catch(err){}
  var sessionId='s'+Date.now().toString(36)+Math.random().toString(36).slice(2);
  var lastLoadedSaveTime=0;
  var saveRepairNotice=false;
  var leaderboardSource='local';
  var leaderboardView='local';
  var leaderboardOpen=true;
  var remoteSubmitTimer=null;
  var lastRemoteSubmit=0;
  var leaderboardRefreshTimer=null;
  var deviceId=getDeviceId();
  function getDeviceId(){
    try{
      var id=localStorage.getItem(DEVICE_ID_KEY);
      if(!id){
        id='d'+Date.now().toString(36)+Math.random().toString(36).slice(2);
        localStorage.setItem(DEVICE_ID_KEY,id);
      }
      return id;
    }catch(err){
      return 'd'+Math.random().toString(36).slice(2);
    }
  }
  function loadPlayerProfile(){
    try{
      var raw=localStorage.getItem(PROFILE_KEY);
      if(raw){
        var p=JSON.parse(raw);
        playerName=cleanName(p.name);
      }
    }catch(err){}
    var input=document.getElementById('player-name');
    if(input) input.value=playerName==='Pilot'?'':playerName;
  }
  function syncNameInput(){
    var input=document.getElementById('player-name');
    if(input) input.value=playerName==='Pilot'?'':playerName;
  }
  function savePlayerProfile(){
    try{
      localStorage.setItem(PROFILE_KEY,JSON.stringify({
        name:playerName,
        updatedAt:Date.now()
      }));
    }catch(err){}
  }
  function readLeaderboard(){
    try{
      var rows=JSON.parse(localStorage.getItem(LEADERBOARD_KEY)||'[]');
      return Array.isArray(rows)?rows:[];
    }catch(err){return [];}
  }
  function updateLeaderboard(){
    try{
      var rows=readLeaderboard();
      var score=Math.floor(totalCredits);
      var current={
        deviceId:deviceId,
        name:playerName,
        wave:wave,
        total:score,
        prestige:prestigeLevel,
        destroyed:totalDestroyed,
        updatedAt:Date.now()
      };
      var found=false;
      for(var i=0;i<rows.length;i++){
        if(rows[i].name===playerName){
          found=true;
          if(score>Number(rows[i].total||0) || prestigeLevel>Number(rows[i].prestige||0) || wave>Number(rows[i].wave||0)){
            rows[i]=current;
          }
          break;
        }
      }
      if(!found) rows.push(current);
      rows.sort(function(a,b){
        return (Number(b.prestige||0)-Number(a.prestige||0)) ||
               (Number(b.wave||0)-Number(a.wave||0)) ||
               (Number(b.total||0)-Number(a.total||0));
      });
      rows=rows.slice(0,8);
      localStorage.setItem(LEADERBOARD_KEY,JSON.stringify(rows));
      if(leaderboardSource!=='global') renderLeaderboard(rows,'LOCAL LEADERBOARD');
      scheduleRemoteLeaderboardSave(current);
    }catch(err){}
  }
  function scheduleRemoteLeaderboardSave(score){
    if(!window.cosmicLeaderboard || !window.cosmicLeaderboard.ready) return;
    var now=Date.now();
    if(now-lastRemoteSubmit<8000){
      clearTimeout(remoteSubmitTimer);
      remoteSubmitTimer=setTimeout(function(){scheduleRemoteLeaderboardSave(score)},8500);
      return;
    }
    lastRemoteSubmit=now;
    window.cosmicLeaderboard.submit(score).then(function(){
      if(leaderboardView==='global') loadGlobalLeaderboard();
    }).catch(function(){});
  }
  function setLeaderboardStatus(text){
    var el=document.getElementById('leaderboard-status');
    if(el) el.textContent=text||'';
  }
  function syncLeaderboardControls(){
    var globalBtn=document.getElementById('leaderboard-global');
    var localBtn=document.getElementById('leaderboard-local');
    var badge=document.getElementById('leaderboard-source-badge');
    if(globalBtn) globalBtn.classList.toggle('active',leaderboardView==='global');
    if(localBtn) localBtn.classList.toggle('active',leaderboardView==='local');
    if(badge) badge.textContent=leaderboardView==='global'?'GLOBAL':'LOCAL';
  }
  function setLeaderboardOpen(open){
    leaderboardOpen=!!open;
    var menu=document.getElementById('leaderboard-menu');
    var toggle=document.getElementById('leaderboard-toggle');
    var arrow=document.getElementById('leaderboard-arrow');
    if(menu) menu.classList.toggle('open',leaderboardOpen);
    if(toggle) toggle.setAttribute('aria-expanded',leaderboardOpen?'true':'false');
    if(arrow) arrow.innerHTML=leaderboardOpen?'&#9662;':'&#9656;';
    if(leaderboardOpen && leaderboardView==='global') loadGlobalLeaderboard();
    syncLeaderboardRefresh();
  }
  function setLeaderboardView(view){
    leaderboardView=view==='global'?'global':'local';
    syncLeaderboardControls();
    if(leaderboardView==='global') loadGlobalLeaderboard();
    else {
      leaderboardSource='local';
      setLeaderboardStatus('Local scores saved on this device');
      renderLeaderboard(readLeaderboard(),'LOCAL LEADERBOARD');
    }
    syncLeaderboardRefresh();
  }
  function syncLeaderboardRefresh(){
    clearInterval(leaderboardRefreshTimer);
    leaderboardRefreshTimer=null;
    if(leaderboardOpen && leaderboardView==='global'){
      leaderboardRefreshTimer=setInterval(function(){
        if(launched && !document.hidden) loadGlobalLeaderboard(true);
      },7000);
    }
  }
  function loadGlobalLeaderboard(){
    if(!window.cosmicLeaderboard || !window.cosmicLeaderboard.ready){
      leaderboardView='local';
      syncLeaderboardControls();
      setLeaderboardStatus('Global leaderboard connecting...');
      renderLeaderboard(readLeaderboard(),'LOCAL LEADERBOARD');
      return;
    }
    leaderboardView='global';
    syncLeaderboardControls();
    setLeaderboardStatus('Syncing global leaderboard...');
    window.cosmicLeaderboard.load().then(function(rows){
      leaderboardSource='global';
      setLeaderboardStatus('Live global scores refresh while open');
      renderLeaderboard(rows,'GLOBAL LEADERBOARD');
    }).catch(function(){
      leaderboardSource='local';
      leaderboardView='local';
      syncLeaderboardControls();
      setLeaderboardStatus('Global unavailable, showing local scores');
      renderLeaderboard(readLeaderboard(),'LOCAL LEADERBOARD');

  }
  function renderLeaderboard(rows,title){
    var list=document.getElementById('leaderboard-list');
    if(!list) return;
    rows=rows||readLeaderboard();
    var titleEl=document.getElementById('leaderboard-title');
    if(titleEl) titleEl.textContent=title||'LOCAL LEADERBOARD';
    syncLeaderboardControls();
    if(!rows.length){
      list.innerHTML='<div style="text-align:center;color:#8888aa;">No scores yet</div>';
      return;
    }
    list.innerHTML=rows.map(function(r,i){
      return '<div class="leader-row">'+
        '<span>#'+(i+1)+'</span>'+
        '<span class="leader-name">'+escapeHTML(r.name||'Pilot')+'</span>'+
        '<span class="leader-score">P'+(r.prestige||0)+' W'+(r.wave||1)+' '+formatNum(Math.floor(r.total||0))+'</span>'+
      '</div>';
    }).join('');
  }
  function escapeHTML(s){
    return String(s).replace(/[&<>"']/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function waveTargetFor(w){
    return w<=1 ? 10 : Math.floor(10+w*3);
  }

  function killsBeforeWave(w){
    if(w<=1) return 0;
    return 10 + (w-2)*10 + 3*(((w-1)*w/2)-1);
  }

  function syncDestroyedCount(){
    totalDestroyed=Math.floor(killsBeforeWave(wave)+waveProgress);
  }

  function currentPlausibleCreditCap(){
    var kills=Math.max(1,totalDestroyed);
    var maxBase=300*(1+(wave-1)*0.2); // Diamond at the highest reached wave.
    var magnet=findUpgrade('magnet');
    var magnetBonus=1+Math.min(magnet.level,30)*0.15;
    var maxPerKill=maxBase*creditMultiplier*prestigeMultiplier*magnetBonus*Math.max(1,waveCreditBonus)*6;
    return Math.max(10000,Math.ceil(kills*maxPerKill*1.25));
  }

  function saveGame(){
    try{
      // A stale/background tab must never overwrite a newer save from another tab.
      var existingRaw=localStorage.getItem(SAVE_KEY);
      if(existingRaw){
        try{
          var existing=JSON.parse(existingRaw);
          if(existing && existing.sessionId!==sessionId && Number(existing.savedAt)>lastLoadedSaveTime){
            return;
          }
        }catch(ignore){}
      }
      syncDestroyedCount();
      var now=Date.now();
      var data={
        version:3,credits:credits,totalCredits:totalCredits,totalDestroyed:totalDestroyed,
        wave:wave,waveProgress:waveProgress,waveTarget:waveTarget,
        prestigeLevel:prestigeLevel,prestigeMultiplier:prestigeMultiplier,
        playerName:playerName,
        upgradeLevels:upgrades.map(function(u){return u.level}),
        savedAt:now,sessionId:sessionId
      };
      localStorage.setItem(SAVE_KEY,JSON.stringify(data));
      lastLoadedSaveTime=now;
    }catch(err){}
  }
  function rebuildStats(){
    clickDamage=1; creditMultiplier=1; autoDP=0; bossDamageMultiplier=1; waveCreditBonus=1;
    for(var i=0;i<upgrades.length;i++){
      var u=upgrades[i], level=u.level;
      if(u.id==='click') clickDamage+=level;
      else if(u.id==='auto') autoDP+=level;
      else if(u.id==='multi') creditMultiplier+=level*.25;
      else if(u.id==='boss') bossDamageMultiplier+=level*.35;
      else if(u.id==='overclock') autoDP+=level*3;
      else if(u.id==='surge') creditMultiplier+=level*.5;
      else if(u.id==='crusher') clickDamage+=level*5;
      else if(u.id==='wavepay') waveCreditBonus+=level*.08;
    }
  }
  function loadGame(){
    try{
      var raw=localStorage.getItem(SAVE_KEY);
      var migrated=false;
      if(!raw){
        raw=localStorage.getItem(LEGACY_SAVE_KEY);
        migrated=!!raw;
      }
      if(!raw) return;

      var d=JSON.parse(raw);
      function safeNum(v,min,max,fallback){
        v=Number(v);
        return Number.isFinite(v)?Math.min(max,Math.max(min,v)):fallback;
      }

      wave=Math.floor(safeNum(d.wave,1,10000,1));
      waveTarget=waveTargetFor(wave);
      waveProgress=Math.floor(safeNum(d.waveProgress,0,waveTarget-1,0));
      prestigeLevel=Math.floor(safeNum(d.prestigeLevel,0,10000,0));
      prestigeMultiplier=safeNum(d.prestigeMultiplier,1,5001,1);
      if(d.playerName) playerName=cleanName(d.playerName);

      if(Array.isArray(d.upgradeLevels)) for(var i=0;i<upgrades.length;i++){
        var lv=Math.floor(safeNum(d.upgradeLevels[i],0,1000,0));
        if(upgrades[i].maxLevel) lv=Math.min(lv,upgrades[i].maxLevel);
        upgrades[i].level=lv;
      }
      rebuildStats();

      // Destroyed is mathematically determined by wave + wave progress.
      // This prevents the impossible 300K/600K kill counter seen around wave 15.
      syncDestroyedCount();

      totalCredits=safeNum(d.totalCredits,0,1e15,0);
      credits=safeNum(d.credits,0,1e15,0);
      var cap=currentPlausibleCreditCap();
      if(totalCredits>cap || credits>totalCredits || migrated){
        if(totalCredits>cap){ totalCredits=cap; saveRepairNotice=true; }
        credits=Math.min(credits,totalCredits);
        if(migrated) saveRepairNotice=true;
      }

      lastLoadedSaveTime=Number(d.savedAt)||0;
      // Immediately move the cleaned legacy state into the isolated V3 save slot.
      if(migrated) saveGame();
    }catch(err){
      credits=0; totalCredits=0; totalDestroyed=0;
      wave=1; waveProgress=0; waveTarget=10;
      prestigeLevel=0; prestigeMultiplier=1;
      for(var i=0;i<upgrades.length;i++) upgrades[i].level=0;
      rebuildStats();
      saveRepairNotice=true;
    }
  }

  function initCanvas(){
    bgCanvas = document.getElementById('bgCanvas');
    bgCtx = bgCanvas.getContext('2d');
    gameCanvas = document.getElementById('gameCanvas');
    gameCtx = gameCanvas.getContext('2d');
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    resizeCanvas();
    window.addEventListener('resize', function(){
      resizeCanvas();
      if(!isMobileLayout()) setShopOpen(false);
      else document.getElementById('shop-backdrop').classList.toggle('active', shopOpen);
      scheduleShopRender();
    });
    window.addEventListener('orientationchange', function(){setTimeout(function(){
      resizeCanvas();
      if(!isMobileLayout()) setShopOpen(false);
      else document.getElementById('shop-backdrop').classList.toggle('active', shopOpen);
      scheduleShopRender();
    },300)});

    // One input path for iPhone/Safari and desktop; prevents duplicate touch + click hits.
    gameCanvas.addEventListener('pointerdown', function(e){
      if(e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault();
      var rect = gameCanvas.getBoundingClientRect();
      handleHit(e.clientX - rect.left, e.clientY - rect.top);
    }, {passive:false});

    // Prevent pull-to-refresh only on game area
    document.getElementById('game-area').addEventListener('touchmove', function(e){e.preventDefault()}, {passive:false});
  }

  function resizeCanvas(){
    var area = document.getElementById('game-area');
    if(!area) return;
    canvasW = area.clientWidth;
    canvasH = area.clientHeight;
    if(canvasW < 1) canvasW = window.innerWidth;
    if(canvasH < 1) canvasH = window.innerHeight;
    bgCanvas.width = canvasW * dpr;
    bgCanvas.height = canvasH * dpr;
    bgCanvas.style.width = canvasW + 'px';
    bgCanvas.style.height = canvasH + 'px';
    bgCtx.setTransform(dpr,0,0,dpr,0,0);
    gameCanvas.width = canvasW * dpr;
    gameCanvas.height = canvasH * dpr;
    gameCanvas.style.width = canvasW + 'px';
    gameCanvas.style.height = canvasH + 'px';
    gameCtx.setTransform(dpr,0,0,dpr,0,0);
    initStars();
  }

  function initStars(){
    stars = [];
    for(var i=0;i<90;i++){
      stars.push({x:Math.random()*canvasW,y:Math.random()*canvasH,
        size:Math.random()*2+0.5,speed:Math.random()*0.5+0.2,
        brightness:Math.random()*0.5+0.5});
    }
  }

  // ASTEROID RARITIES
  // Stone = common, Iron = uncommon, Gold = rare, Purple = epic,
  // Diamond = legendary jackpot.
  var objectTypes = [
    {name:'stone asteroid',color:'#777b86',hp:3,size:29,credits:5,shape:'asteroid',variant:'stone',rarity:'COMMON'},
    {name:'iron asteroid',color:'#aeb8c4',hp:5,size:28,credits:12,shape:'asteroid',variant:'iron',rarity:'UNCOMMON'},
    {name:'gold asteroid',color:'#d9a52a',hp:8,size:28,credits:35,shape:'asteroid',variant:'gold',rarity:'RARE'},
    {name:'amethyst asteroid',color:'#a65cff',hp:13,size:29,credits:90,shape:'asteroid',variant:'amethyst',rarity:'EPIC'},
    {name:'diamond asteroid',color:'#43d9ff',hp:22,size:31,credits:300,shape:'asteroid',variant:'diamond',rarity:'LEGENDARY'},
    {name:'raider ship',color:'#66ff99',hp:8,size:34,credits:25,shape:'ship',variant:'raider',rarity:'HOSTILE'},
    {name:'boss',color:'#ff3366',hp:50,size:64,credits:120,shape:'boss',variant:'alien',rarity:'BOSS'}
  ];

  function spawnObject(){
    if(!gameRunning || document.hidden) return;
    // Mobile safety cap.
    if(objects.length>=(turboMode ? 140 : 30)) return;

    var typeIndex, r = Math.random();
    var bossGate=(waveProgress>=waveTarget-1 && wave%5===0);

    if(bossGate){
      // Critical fix: only ONE boss may exist at a time.
      // Older builds spawned a new giant boss every 900ms until one died.
      for(var b=0;b<objects.length;b++){
        if(objects[b].shape==='boss') return;
      }
      typeIndex=6;
    } else {
      // Spawn odds: 50% stone, 24% iron, 12% gold, 5% amethyst,
      // 1% diamond jackpot, 8% enemy ship.
      if(r<0.50) typeIndex=0;
      else if(r<0.74) typeIndex=1;
      else if(r<0.86) typeIndex=2;
      else if(r<0.91) typeIndex=3;
      else if(r<0.92) typeIndex=4;
      else typeIndex=5;
    }
    var type = objectTypes[typeIndex];
    var sizeU = findUpgrade('size');
    // Big Targets stays useful without allowing huge draw/hit boxes.
    var sizeMod = Math.min(1.45,1+(sizeU.level*0.06));
    var size = Math.min(type.size*sizeMod, type.shape==='boss'?88:50);
    var hpScale = type.shape==='boss'
      ? 1+(wave-1)*0.45+Math.pow(wave,1.18)*0.08
      : 1+(wave-1)*0.3;
    var speedU = findUpgrade('speed');
    var speedMod = type.shape==='boss' ? Math.max(0.22,1-speedU.level*0.04) : Math.max(0.3,1-speedU.level*0.07);
    var baseCredits = type.shape==='boss'
      ? Math.ceil((type.credits+wave*45)*(1+(wave-1)*0.28))
      : Math.ceil(type.credits*(1+(wave-1)*0.2));
    objects.push({
      x:Math.random()*(canvasW-size*2)+size, y:-size, size:size,
      hp:Math.ceil(type.hp*hpScale), maxHp:Math.ceil(type.hp*hpScale),
      speed:(Math.random()*1.2+0.8+wave*0.08)*speedMod,
      credits:baseCredits,
      color:type.color, shape:type.shape, name:type.name, variant:(type.shape==='boss'?(wave%10===0?'android':'alien'):type.variant),
      rotation:Math.random()*Math.PI*2, rotSpeed:(Math.random()-0.5)*0.04
    });
  }

  function findUpgrade(id){
    for(var i=0;i<upgrades.length;i++){if(upgrades[i].id===id)return upgrades[i];}
    return {level:0};
  }

  // TOUCH
  function onTouch(e){
    e.preventDefault();
    var rect = gameCanvas.getBoundingClientRect();
    for(var i=0;i<e.changedTouches.length;i++){
      var t = e.changedTouches[i];
      var mx = (t.clientX - rect.left)*(canvasW/rect.width);
      var my = (t.clientY - rect.top)*(canvasH/rect.height);
      handleHit(mx,my);
    }
  }

  // CLICK (desktop)
  function onCanvasClick(e){
    var rect = gameCanvas.getBoundingClientRect();
    var mx = (e.clientX-rect.left)*(canvasW/rect.width);
    var my = (e.clientY-rect.top)*(canvasH/rect.height);
    handleHit(mx,my);
  }

  function handleHit(mx,my){
    var hit = false;
    var isMobile = window.innerWidth<=768;
    var hitBonus = isMobile?15:0;
    for(var i=objects.length-1;i>=0;i--){
      var obj = objects[i];
      var dx = mx-obj.x, dy = my-obj.y;
      var hitR = obj.size+hitBonus;
      if(dx*dx+dy*dy < hitR*hitR){
        var dmg = clickDamage;
        if(obj.shape==='boss') dmg=Math.ceil(dmg*bossDamageMultiplier);
        var critU = findUpgrade('crit');
        if(Math.random()<critU.level*0.04){
          dmg*=5;
          spawnClickText(mx,my,'CRIT! '+dmg,'#ff3366');
        } else {
          spawnClickText(mx,my,''+dmg,'#00e5ff');
        }
        obj.hp -= dmg;
        spawnParticles(mx,my,obj.color,5);
        if(obj.hp<=0) destroyObject(obj,i);
        combo++;
        clearTimeout(comboTimer);
        comboTimer = setTimeout(function(){combo=0;updateCombo()},2000);
        updateCombo();
        hit = true;
        break;
      }
    }
    if(!hit) spawnParticles(mx,my,'#334',3);
  }

  function destroyObject(obj,index){
    if(!obj || obj.destroying) return;
    obj.destroying=true;

    // Remove first so recursive chain reactions cannot destroy/pay the same target twice.
    var idx=objects.indexOf(obj);
    if(idx>-1) objects.splice(idx,1);

    var magnetU=findUpgrade('magnet');
    var magnetBonus=1+magnetU.level*0.15;
    var comboBonus=1+Math.min(combo,50)*0.05;
    var waveBonus=Math.min(6,1+(wave-1)*(waveCreditBonus-1));
    var earned=Math.ceil(obj.credits*creditMultiplier*prestigeMultiplier*magnetBonus*comboBonus*waveBonus);
    if(!Number.isFinite(earned) || earned<0) earned=0;
    earned=Math.min(earned,1e12);

    credits+=earned; totalCredits+=earned; waveProgress++;
    if(!Number.isFinite(credits)) credits=0;
    if(!Number.isFinite(totalCredits)) totalCredits=credits;
    updateLeaderboard();

    spawnParticles(obj.x,obj.y,obj.color,8);
    spawnClickText(obj.x,obj.y-20,'+'+earned,'#ffcc00');

    var chainU=findUpgrade('chain');
    if(chainU.level>0){
      var chainDmg=Math.ceil(clickDamage*chainU.level*0.5);
      var chainRange=100+chainU.level*15;
      // Snapshot candidates because recursive kills mutate objects[].
      var nearby=objects.slice();
      for(var j=nearby.length-1;j>=0;j--){
        var other=nearby[j];
        if(!other || other.destroying || objects.indexOf(other)===-1) continue;
        var ddx=other.x-obj.x, ddy=other.y-obj.y;
        if(ddx*ddx+ddy*ddy<chainRange*chainRange){
          other.hp-=chainDmg;
          spawnParticles(other.x,other.y,'#ffaa00',2);
          if(other.hp<=0) destroyObject(other);
        }
      }
    }

    while(waveProgress>=waveTarget){
      waveProgress-=waveTarget;
      wave++;
      waveTarget=waveTargetFor(wave);
      announceWave();
    }
    syncDestroyedCount();
    updateHUD(); scheduleShopRender(); saveGame();
  }

  function autoTick(){
    if(!gameRunning || document.hidden || (!turboMode && autoDP<=0)) return;
    var tickDamage = turboMode ? Math.max(autoDP, 25) : autoDP;
    // Snapshot prevents chain-reaction removals from invalidating this loop.
    var targets=objects.slice();
    for(var i=targets.length-1;i>=0;i--){
      var obj=targets[i];
      if(!obj || obj.destroying || objects.indexOf(obj)===-1) continue;
      obj.hp-=tickDamage;
      spawnParticles(obj.x,obj.y,'#00aaff',1);
      if(obj.hp<=0) destroyObject(obj);
    }
    updateHUD();
  }

  function announceWave(){
    var el=document.getElementById('wave-announce');
    el.textContent='WAVE '+wave;
    el.style.opacity=1;
    setTimeout(function(){el.style.opacity=0},2000);
  }

  function updateCombo(){
    var el=document.getElementById('combo-display');
    if(combo>1){
      el.textContent='COMBO x'+combo;
      el.classList.add('active');
      el.style.fontSize=Math.min(22+combo*0.5,40)+'px';

  }

  function updateHUD(){
    document.getElementById('credits').textContent=formatNum(Math.floor(credits));
    document.getElementById('total-credits').textContent=formatNum(Math.floor(totalCredits));
    document.getElementById('dps').textContent=formatNum(autoDP);
    document.getElementById('wave').textContent=wave;
    document.getElementById('destroyed').textContent=formatNum(totalDestroyed);
    var progressText=Math.min(waveProgress,waveTarget)+' / '+waveTarget;
    document.getElementById('wave-progress-text').textContent=progressText;
    document.getElementById('wave-progress-fill').style.width=Math.min(100,(waveProgress/waveTarget)*100)+'%';
    var prestigeRequirement=getPrestigeRequirement();
    document.getElementById('prestige-info').textContent=
      totalCredits>=prestigeRequirement
        ? 'Ready! '+prestigeMultiplier.toFixed(1)+'x -> '+(prestigeMultiplier+0.5).toFixed(1)+'x'
        : 'Need '+formatNum(prestigeRequirement-Math.floor(totalCredits))+' more total credits';
  }

  function renderUpgrades(){
    var list=document.getElementById('upgrade-list');
    list.innerHTML='';
    for(var i=0;i<upgrades.length;i++){
      (function(idx){
        var u=upgrades[idx];
        var cost=getCost(u);
        var locked=u.minPrestige&&prestigeLevel<u.minPrestige;
        var canBuy=!locked&&credits>=cost&&(!u.maxLevel||u.level<u.maxLevel);
        var maxed=u.maxLevel&&u.level>=u.maxLevel;
        var btn=document.createElement('div');
        btn.className='upgrade-btn'+(canBuy?'':' disabled');
        btn.innerHTML=
          '<div class="upgrade-name">'+u.name+'</div>'+
          '<div class="upgrade-desc">'+u.desc+'</div>'+
          '<div class="upgrade-cost">'+(locked?'UNLOCKS AT PRESTIGE '+u.minPrestige:(maxed?'MAXED':'Cost: '+formatNum(cost)))+'</div>'+
          '<div class="upgrade-level">Lv '+u.level+(u.maxLevel?'/'+u.maxLevel:'')+'</div>';
        if(canBuy){
          btn.addEventListener('pointerup',function(e){
            e.preventDefault(); e.stopPropagation(); buyUpgrade(idx);
          },{passive:false});
        }
        list.appendChild(btn);
      })(i);
    }
  }

  function buyUpgrade(index){
    var u=upgrades[index];
    var cost=getCost(u);
    if(u.minPrestige&&prestigeLevel<u.minPrestige) return;
    if(credits<cost) return;
    if(u.maxLevel&&u.level>=u.maxLevel) return;
    credits-=cost; u.level++; u.effect();
    updateHUD(); renderUpgrades(); saveGame();
    updateLeaderboard();
  }

  window.prestige = function(){
    if(totalCredits<getPrestigeRequirement()) return;
    prestigeLevel++; prestigeMultiplier+=0.5;
    credits=0;totalCredits=0;totalDestroyed=0;
    clickDamage=1;creditMultiplier=1;autoDP=0;combo=0;
    wave=1;waveProgress=0;waveTarget=10;objects=[];
    for(var i=0;i<upgrades.length;i++) upgrades[i].level=0;
    rebuildStats();
    syncDestroyedCount();
    updateHUD(); renderUpgrades();
    updateLeaderboard();
    var el=document.getElementById('wave-announce');
    el.textContent='PRESTIGE '+prestigeLevel+' '+prestigeMultiplier.toFixed(1)+'x';
    el.style.opacity=1;
    setTimeout(function(){el.style.opacity=0},3000);
    saveGame();
  };

  // PARTICLES
  function spawnParticles(x,y,color,count){
    // Hard cap prevents particle storms from stalling mobile Safari.
    if(particles.length>220) particles.splice(0,particles.length-180);
    count=Math.min(count,10);
    for(var i=0;i<count;i++){
      particles.push({x:x,y:y,
        vx:(Math.random()-0.5)*7,vy:(Math.random()-0.5)*7,
        size:Math.random()*3.5+1.5,color:color,life:1,
        decay:Math.random()*0.03+0.02});
    }
  }

  function spawnClickText(x,y,text,color){
    var area=document.getElementById('game-area');
    var old=area.querySelectorAll('.click-text');
    if(old.length>=24 && old[0].parentNode) old[0].parentNode.removeChild(old[0]);
    var el=document.createElement('div');
    el.className='click-text';
    el.textContent=text;
    el.style.left=x+'px';
    el.style.top=y+'px';
    el.style.color=color;
    el.style.textShadow='0 0 10px '+color;
    area.appendChild(el);
    setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},700);
  }

  // DRAWING
  function drawStars(){
    bgCtx.fillStyle='#0a0a1a';
    bgCtx.fillRect(0,0,canvasW,canvasH);
    for(var i=0;i<stars.length;i++){
      var s=stars[i];
      s.y+=s.speed;
      if(s.y>canvasH){s.y=0;s.x=Math.random()*canvasW;}
      bgCtx.fillStyle='rgba(200,220,255,'+s.brightness+')';
      bgCtx.beginPath();
      bgCtx.arc(s.x,s.y,s.size,0,Math.PI*2);
      bgCtx.fill();
    }
  }

  function drawObjects(){
    gameCtx.clearRect(0,0,canvasW,canvasH);
    for(var i=objects.length-1;i>=0;i--){
      var obj=objects[i];
      obj.y+=obj.speed;
      obj.rotation+=obj.rotSpeed;
      if(obj.y>canvasH+obj.size*2){objects.splice(i,1);continue;}
      gameCtx.save();
      gameCtx.translate(obj.x,obj.y);
      gameCtx.rotate(obj.rotation);
      // Shadows are expensive on iOS canvas; reserve stronger glow for special targets.
      gameCtx.shadowBlur=(obj.variant==='diamond'?10:obj.variant==='amethyst'?7:obj.shape==='boss'?8:3);
      gameCtx.shadowColor=obj.color;
      if(obj.shape==='asteroid') drawAsteroid(obj);
      else if(obj.shape==='ship') drawShip(obj);
      else if(obj.shape==='boss') drawBoss(obj);
      gameCtx.restore();
      if(obj.hp<obj.maxHp){
        var bW=obj.size*1.5,bH=5,bX=obj.x-bW/2,bY=obj.y-obj.size-10;
        gameCtx.fillStyle='#222';
        gameCtx.fillRect(bX,bY,bW,bH);
        var pct=obj.hp/obj.maxHp;
        gameCtx.fillStyle=pct>0.5?'#66ff66':pct>0.25?'#ffaa00':'#ff3333';
        gameCtx.fillRect(bX,bY,bW*pct,bH);
      }
    }
  }

  function drawAsteroid(obj){
    var seed = obj.variant==='diamond' ? 0.91 : obj.variant==='amethyst' ? 0.76 : obj.variant==='gold' ? 0.62 : obj.variant==='iron' ? 0.48 : 0.38;
    gameCtx.fillStyle=obj.color;
    gameCtx.beginPath();
    for(var i=0;i<12;i++){
      var a=(i/12)*Math.PI*2;
      var r=obj.size*(0.78 + 0.16*Math.sin(i*4.31+seed*10) + 0.07*Math.cos(i*7.7));
      i===0?gameCtx.moveTo(Math.cos(a)*r,Math.sin(a)*r):gameCtx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
    }
    gameCtx.closePath(); gameCtx.fill();
    gameCtx.strokeStyle=obj.variant==='diamond'?'#e9fdff':obj.variant==='amethyst'?'#e3c5ff':obj.variant==='gold'?'#ffe39a':obj.variant==='iron'?'#e5edf5':'rgba(255,255,255,.22)'; gameCtx.lineWidth=obj.variant==='diamond'?3:2; gameCtx.stroke();
    // Craters / mineral scars make these read as actual asteroids instead of polygons.
    gameCtx.shadowBlur=0;
    var spots=[[ -.28,-.18,.22],[.26,.15,.16],[-.05,.34,.12],[.18,-.34,.1]];
    for(var c=0;c<spots.length;c++){
      gameCtx.beginPath();
      gameCtx.fillStyle=obj.variant==='diamond'?'rgba(0,95,130,.28)':obj.variant==='amethyst'?'rgba(72,20,110,.34)':obj.variant==='gold'?'rgba(92,55,10,.42)':obj.variant==='iron'?'rgba(45,55,65,.34)':'rgba(30,32,38,.35)';
      gameCtx.arc(spots[c][0]*obj.size,spots[c][1]*obj.size,spots[c][2]*obj.size,0,Math.PI*2); gameCtx.fill();
    }
    if(obj.variant==='diamond' || obj.variant==='amethyst'){
      gameCtx.save();
      gameCtx.shadowBlur=obj.variant==='diamond'?10:7;
      gameCtx.shadowColor=obj.color;
      gameCtx.strokeStyle=obj.variant==='diamond'?'rgba(235,255,255,.9)':'rgba(235,205,255,.75)';
      gameCtx.lineWidth=1.5;
      gameCtx.beginPath();
      gameCtx.moveTo(-obj.size*.48,obj.size*.12);
      gameCtx.lineTo(0,-obj.size*.5);
      gameCtx.lineTo(obj.size*.42,obj.size*.18);
      gameCtx.moveTo(-obj.size*.25,-obj.size*.28);
      gameCtx.lineTo(obj.size*.2,obj.size*.42);
      gameCtx.stroke();
      gameCtx.restore();
    }
  }

  function drawShip(obj){
    var z=obj.size;
    gameCtx.shadowBlur=6; gameCtx.shadowColor=obj.color;
    gameCtx.fillStyle='#17232d';
    gameCtx.beginPath(); gameCtx.moveTo(0,-z); gameCtx.lineTo(z*.82,z*.52); gameCtx.lineTo(z*.3,z*.38); gameCtx.lineTo(0,z*.68); gameCtx.lineTo(-z*.3,z*.38); gameCtx.lineTo(-z*.82,z*.52); gameCtx.closePath(); gameCtx.fill();
    gameCtx.strokeStyle=obj.color; gameCtx.lineWidth=2.5; gameCtx.stroke();
    gameCtx.fillStyle=obj.color; gameCtx.beginPath(); gameCtx.moveTo(0,-z*.72); gameCtx.lineTo(z*.25,z*.22); gameCtx.lineTo(-z*.25,z*.22); gameCtx.closePath(); gameCtx.fill();
    gameCtx.fillStyle='#80eaff'; gameCtx.beginPath(); gameCtx.ellipse(0,-z*.12,z*.18,z*.25,0,0,Math.PI*2); gameCtx.fill();
    gameCtx.shadowColor='#ff6b22'; gameCtx.shadowBlur=7; gameCtx.fillStyle='#ff6b22';
    gameCtx.beginPath(); gameCtx.moveTo(-z*.18,z*.48); gameCtx.lineTo(0,z*.95); gameCtx.lineTo(z*.18,z*.48); gameCtx.closePath(); gameCtx.fill();
  }

  function drawBoss(obj){
    var z=obj.size; gameCtx.shadowBlur=8; gameCtx.shadowColor=obj.color;
    if(obj.variant==='android'){
      gameCtx.fillStyle='#303744'; gameCtx.fillRect(-z*.52,-z*.58,z*1.04,z*1.12);
      gameCtx.strokeStyle='#ff335f'; gameCtx.lineWidth=4; gameCtx.strokeRect(-z*.52,-z*.58,z*1.04,z*1.12);
      gameCtx.fillStyle='#111722'; gameCtx.fillRect(-z*.38,-z*.28,z*.76,z*.25);
      gameCtx.fillStyle='#ff335f'; gameCtx.fillRect(-z*.28,-z*.2,z*.18,z*.09); gameCtx.fillRect(z*.1,-z*.2,z*.18,z*.09);
      gameCtx.strokeStyle='#9da9b7'; gameCtx.lineWidth=7;
      gameCtx.beginPath(); gameCtx.moveTo(-z*.48,z*.28); gameCtx.lineTo(-z*.82,z*.68); gameCtx.moveTo(z*.48,z*.28); gameCtx.lineTo(z*.82,z*.68); gameCtx.stroke();
    } else {
      gameCtx.fillStyle='#6c35a8'; gameCtx.beginPath(); gameCtx.ellipse(0,0,z*.62,z*.72,0,0,Math.PI*2); gameCtx.fill();
      gameCtx.strokeStyle='#b879ff'; gameCtx.lineWidth=4; gameCtx.stroke();
      gameCtx.fillStyle='#05070c'; gameCtx.beginPath(); gameCtx.ellipse(-z*.22,-z*.12,z*.14,z*.25,-.25,0,Math.PI*2); gameCtx.ellipse(z*.22,-z*.12,z*.14,z*.25,.25,0,Math.PI*2); gameCtx.fill();
      gameCtx.strokeStyle='#8d4de0'; gameCtx.lineWidth=6;
      for(var i=0;i<4;i++){var x=(-.45+i*.3)*z;gameCtx.beginPath();gameCtx.moveTo(x,z*.48);gameCtx.quadraticCurveTo(x+(i<2?-z*.2:z*.2),z*.82,x+(i<2?-z*.35:z*.35),z);gameCtx.stroke();}
    }
  }

  function drawParticles(){
    for(var i=particles.length-1;i>=0;i--){
      var p=particles[i];
      p.x+=p.vx;p.y+=p.vy;p.life-=p.decay;p.vx*=0.97;p.vy*=0.97;
      if(p.life<=0){particles.splice(i,1);continue;}
      gameCtx.fillStyle=p.color;
      gameCtx.globalAlpha=p.life;
      gameCtx.beginPath();gameCtx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);gameCtx.fill();
      gameCtx.globalAlpha=1;
    }
  }

  function gameLoop(){
    if(gameRunning && !document.hidden){
      drawStars();drawObjects();drawParticles();
    }
    requestAnimationFrame(gameLoop);
  }

})();
</script>
<script>
(function(){
  "use strict";

  var firebaseConfig = {
    apiKey: "AIzaSyBT-LyoBbOZ47Rq9CTwyCNwxuPf83cgI6Y",
    projectId: "cosmic-crusher-6a921"
  };
  var baseUrl = "https://firestore.googleapis.com/v1/projects/" +
    firebaseConfig.projectId + "/databases/(default)/documents/leaderboard";

  function request(method,url,body){
    return new Promise(function(resolve,reject){
      var xhr = new XMLHttpRequest();
      xhr.open(method,url,true);
      xhr.setRequestHeader("Content-Type","application/json");
      xhr.onload = function(){
        var data = null;
        try{ data = xhr.responseText ? JSON.parse(xhr.responseText) : null; }catch(err){}
        if(xhr.status>=200 && xhr.status<300) resolve(data);
        else reject({status:xhr.status,data:data});
      };
      xhr.onerror = function(){ reject({status:0}); };
      xhr.send(body ? JSON.stringify(body) : null);
    });
  }

  function cleanRemoteScore(score){
    return {
      deviceId:String(score.deviceId||"unknown").slice(0,80),
      name:String(score.name||"Pilot").slice(0,18),
      prestige:Math.max(0,Math.floor(Number(score.prestige)||0)),
      wave:Math.max(1,Math.floor(Number(score.wave)||1)),
      total:Math.max(0,Math.floor(Number(score.total)||0)),
      destroyed:Math.max(0,Math.floor(Number(score.destroyed)||0)),
      updatedAt:Date.now()
    };
  }

  function toFields(score){
    return {fields:{
      deviceId:{stringValue:score.deviceId},
      name:{stringValue:score.name},
      prestige:{integerValue:String(score.prestige)},
      wave:{integerValue:String(score.wave)},
      total:{integerValue:String(score.total)},
      destroyed:{integerValue:String(score.destroyed)},
      updatedAt:{integerValue:String(score.updatedAt)}
    }};
  }

  function fromDoc(doc){
    var f = doc && doc.fields ? doc.fields : {};
    function str(name,fallback){return f[name] && f[name].stringValue || fallback;}
    function num(name,fallback){return Number(f[name] && (f[name].integerValue || f[name].doubleValue)) || fallback;}
    return {
      deviceId:str("deviceId",""),
      name:str("name","Pilot"),
      prestige:num("prestige",0),
      wave:num("wave",1),
      total:num("total",0),
      destroyed:num("destroyed",0),
      updatedAt:num("updatedAt",0)
    };
  }

  function isBetter(next,prev){
    if(!prev) return true;
    return next.prestige>Number(prev.prestige||0) ||
      (next.prestige===Number(prev.prestige||0) && next.wave>Number(prev.wave||0)) ||
      (next.prestige===Number(prev.prestige||0) && next.wave===Number(prev.wave||0) && next.total>Number(prev.total||0));
  }

  window.cosmicLeaderboard = {
    ready:true,
    submit:function(score){
      var clean = cleanRemoteScore(score);
      var id = (clean.deviceId+"_"+clean.name.toLowerCase().replace(/[^a-z0-9]+/g,"_")).slice(0,140);
      var docUrl = baseUrl + "/" + encodeURIComponent(id) + "?key=" + firebaseConfig.apiKey;
      return request("GET",docUrl).catch(function(err){
        if(err && err.status===404) return null;
        throw err;
      }).then(function(existing){
        var prev = existing ? fromDoc(existing) : null;
        if(!isBetter(clean,prev)) return null;
        return request("PATCH",docUrl,toFields(clean));
      });
    },
    load:function(){
      var url = baseUrl + "?key=" + firebaseConfig.apiKey +
        "&pageSize=10&orderBy=prestige%20desc,wave%20desc,total%20desc";
      return request("GET",url).then(function(data){
        var docs = data && data.documents ? data.documents : [];
        return docs.map(fromDoc);
      });
    }
  };

  window.dispatchEvent(new Event("cosmicLeaderboardReady"));
})();
</script>
