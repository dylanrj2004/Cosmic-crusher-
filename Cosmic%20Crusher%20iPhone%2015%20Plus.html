<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cosmic Crusher">
<meta name="mobile-web-app-capable" content="yes">
<title>Cosmic Crusher</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  background:#0a0a1a;
  font-family:-apple-system,'Segoe UI',Arial,sans-serif;
  overflow:hidden;
  -webkit-user-select:none;
  user-select:none;
  color:#fff;
  height:100%;width:100%;
  min-height:100dvh;
  overscroll-behavior:none;
  -webkit-touch-callout:none;
  position:fixed;top:0;left:0;
}
#start-screen{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:radial-gradient(ellipse at center,#1a1040 0%,#0a0a1a 70%);
  z-index:200;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;
  padding:20px;
  padding-top:env(safe-area-inset-top,20px);
  padding-bottom:env(safe-area-inset-bottom,20px);
  touch-action:manipulation;
}
#start-screen h1{
  font-size:clamp(32px,8vw,56px);color:#00e5ff;
  text-shadow:0 0 40px rgba(0,200,255,0.6),0 0 80px rgba(0,200,255,0.3);
  letter-spacing:4px;text-align:center;
}
#start-screen p{
  color:#8888bb;font-size:clamp(14px,3.5vw,16px);
  max-width:400px;text-align:center;line-height:1.6;
}
#start-btn{
  background:linear-gradient(135deg,#00aaff,#0066cc);
  border:none;border-radius:30px;padding:18px 55px;
  color:#fff;font-size:20px;font-weight:bold;
  cursor:pointer;letter-spacing:3px;
  box-shadow:0 0 30px rgba(0,150,255,0.4);
  min-height:54px;
  touch-action:manipulation;
  -webkit-appearance:none;
  position:relative;
  z-index:210;
}
#start-btn:active{transform:scale(0.95);box-shadow:0 0 50px rgba(0,150,255,0.6)}

#game-container{display:none;height:100dvh;width:100%;position:relative}
@media(min-width:769px){
  #game-container{display:none;flex-direction:row}
  #shop-panel{width:280px;border-left:2px solid rgba(0,200,255,0.2)}
  #shop-toggle{display:none!important}
}
@media(max-width:768px){
  #game-container{flex-direction:column}
  #shop-panel{
    position:fixed;bottom:0;left:0;right:0;height:55vh;
    border-top:2px solid rgba(0,200,255,0.4);border-left:none;
    transform:translateY(100%);transition:transform 0.3s ease;
    z-index:50;border-radius:20px 20px 0 0;
    padding-bottom:env(safe-area-inset-bottom,20px);
  }
  #shop-panel.open{transform:translateY(0)}
  #shop-toggle{
    display:flex!important;position:fixed;
    bottom:calc(12px + env(safe-area-inset-bottom,0px));right:12px;
    z-index:40;width:56px;height:56px;border-radius:50%;
    background:linear-gradient(135deg,#2a1a5e,#4a2a8e);
    border:2px solid rgba(100,80,200,0.6);color:#fff;font-size:24px;
    align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 0 20px rgba(100,80,200,0.4);
    touch-action:manipulation;
  }
  #shop-toggle:active{transform:scale(0.9)}
  .hud-item{font-size:12px!important;padding:5px 10px!important}
  #combo-display{font-size:22px!important}
  #wave-announce{font-size:32px!important}
}
#game-area{
  flex:1;position:relative;overflow:hidden;
  cursor:crosshair;min-width:0;min-height:0;
  touch-action:none;
}
canvas{position:absolute;top:0;left:0;width:100%;height:100%}
#bgCanvas{z-index:0}
#gameCanvas{z-index:1}
#hud{
  position:absolute;
  top:calc(10px + env(safe-area-inset-top,0px));
  left:calc(10px + env(safe-area-inset-left,0px));
  z-index:10;display:flex;flex-direction:column;gap:5px;
}
.hud-item{
  background:rgba(0,0,0,0.75);border:1px solid rgba(0,200,255,0.3);
  border-radius:8px;padding:6px 14px;font-size:14px;color:#00e5ff;
  text-shadow:0 0 8px rgba(0,200,255,0.5);
  -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);
}
.hud-item span{color:#fff;font-weight:bold}
#combo-display{
  position:absolute;
  top:calc(10px + env(safe-area-inset-top,0px));
  left:50%;transform:translateX(-50%);z-index:10;
  font-size:28px;font-weight:bold;color:#ff6600;
  text-shadow:0 0 20px rgba(255,100,0,0.8);
  opacity:0;transition:opacity 0.3s;pointer-events:none;
}
#combo-display.active{opacity:1}
#wave-announce{
  position:absolute;top:45%;left:50%;
  transform:translate(-50%,-50%);z-index:15;
  font-size:42px;font-weight:bold;color:#ff3366;
  text-shadow:0 0 30px rgba(255,50,100,0.8);
  opacity:0;pointer-events:none;transition:opacity 0.5s;
  text-align:center;white-space:nowrap;
}
#shop-panel{
  background:linear-gradient(180deg,#0d1025 0%,#1a1040 100%);
  padding:15px;overflow-y:auto;-webkit-overflow-scrolling:touch;
  z-index:50;display:flex;flex-direction:column;gap:8px;
  touch-action:pan-y;
}
#shop-panel h2{
  color:#00e5ff;font-size:18px;text-align:center;margin-bottom:5px;
  text-shadow:0 0 10px rgba(0,200,255,0.5);letter-spacing:3px;
}
#shop-handle{display:none;width:40px;height:5px;background:rgba(255,255,255,0.3);border-radius:3px;margin:0 auto 8px auto}
@media(max-width:768px){#shop-handle{display:block}}
.upgrade-btn{
  background:linear-gradient(135deg,#1a1a3e,#2a1a4e);
  border:1px solid rgba(100,80,200,0.4);border-radius:12px;
  padding:12px 14px;color:#fff;cursor:pointer;
  transition:all 0.15s;text-align:left;min-height:44px;
  position:relative;touch-action:manipulation;
}
.upgrade-btn:active:not(.disabled){
  transform:scale(0.97);
  background:linear-gradient(135deg,#3a3a6e,#4a3a7e);
}
.upgrade-btn.disabled{opacity:0.4;cursor:not-allowed}
.upgrade-name{font-weight:bold;font-size:14px;color:#c8b8ff}
.upgrade-desc{font-size:12px;color:#8888aa;margin-top:3px}
.upgrade-cost{font-size:13px;color:#ffcc00;margin-top:5px}
.upgrade-level{font-size:12px;color:#66ff88;position:absolute;top:12px;right:14px}
#prestige-section{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,100,200,0.3)}
#prestige-btn{
  background:linear-gradient(135deg,#4a0030,#6a0050);
  border:1px solid rgba(255,100,200,0.5);width:100%;
  border-radius:12px;padding:14px;color:#ff66cc;cursor:pointer;
  font-size:15px;font-weight:bold;
  text-shadow:0 0 10px rgba(255,100,200,0.5);
  min-height:44px;touch-action:manipulation;
}
#prestige-btn:active{transform:scale(0.97);background:linear-gradient(135deg,#6a0050,#8a0070)}
.click-text{
  position:absolute;pointer-events:none;z-index:10;
  font-weight:bold;font-size:20px;animation:floatUp 0.7s forwards;
}
@keyframes floatUp{
  0%{opacity:1;transform:translateY(0) scale(1)}
  100%{opacity:0;transform:translateY(-50px) scale(1.4)}
}
#shop-backdrop{
  display:none;position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.5);z-index:45;
}
#shop-backdrop.active{display:block}
</style>
</head>
<body>

<div id="start-screen">
  <h1>COSMIC CRUSHER</h1>
  <p>Asteroids rain from the sky! Tap to destroy them, earn credits, and upgrade your arsenal.</p>
  <button id="start-btn" type="button">LAUNCH</button>
</div>

<div id="game-container">
  <div id="game-area">
    <canvas id="bgCanvas"></canvas>
    <canvas id="gameCanvas"></canvas>
    <div id="hud">
      <div class="hud-item">Credits: <span id="credits">0</span></div>
      <div class="hud-item">Total: <span id="total-credits">0</span></div>
      <div class="hud-item">DPS: <span id="dps">0</span>/s</div>
      <div class="hud-item">Wave: <span id="wave">1</span></div>
      <div class="hud-item">Destroyed: <span id="destroyed">0</span></div>
    </div>
    <div id="combo-display">COMBO x1</div>
    <div id="wave-announce"></div>
  </div>
  <div id="shop-backdrop"></div>
  <button id="shop-toggle" style="display:none;">&#9881;</button>
  <div id="shop-panel">
    <div id="shop-handle"></div>
    <h2>UPGRADES</h2>
    <div id="upgrade-list"></div>
    <div id="prestige-section">
      <button id="prestige-btn" type="button">PRESTIGE<br><span style="font-size:12px;color:#cc88aa;">Reset for permanent multiplier</span></button>
      <div style="text-align:center;margin-top:6px;font-size:12px;color:#aa6688;" id="prestige-info">Requires 10,000 total credits</div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // iPhone/iOS-safe button wiring: one pointer event per physical press.
  function wireStartButton(){
    var btn = document.getElementById('start-btn');
    if(!btn) return;

    btn.addEventListener('pointerdown', function(){
      btn.style.transform = 'scale(0.95)';
    }, {passive:true});

    btn.addEventListener('pointerup', function(e){
      btn.style.transform = '';
      launchGame(e);
    }, {passive:false});

    btn.addEventListener('pointercancel', function(){
      btn.style.transform = '';
    }, {passive:true});
  }

  // STATE
  var credits = 0, totalCredits = 0, totalDestroyed = 0;
  var clickDamage = 1, creditMultiplier = 1, autoDP = 0;
  var combo = 0, comboTimer = null;
  var wave = 1, waveProgress = 0, waveTarget = 10;
  var prestigeLevel = 0, prestigeMultiplier = 1;
  var gameRunning = false, shopOpen = false;
  var objects = [], particles = [], stars = [];
  var bgCanvas, bgCtx, gameCanvas, gameCtx;
  var canvasW = 300, canvasH = 500, dpr = 1;
  var launched = false;

  var upgrades = [
    {id:'click',name:'Click Power',desc:'Increase tap damage',baseCost:10,costMult:1.5,level:0,effect:function(){clickDamage+=1}},
    {id:'auto',name:'Auto Laser',desc:'Auto-damages objects each second',baseCost:50,costMult:1.6,level:0,effect:function(){autoDP+=1}},
    {id:'crit',name:'Critical Strike',desc:'Chance for 5x tap damage',baseCost:100,costMult:1.8,level:0,maxLevel:20,effect:function(){}},
    {id:'multi',name:'Credit Boost',desc:'Multiply all credits earned',baseCost:200,costMult:2.0,level:0,effect:function(){creditMultiplier+=0.25}},
    {id:'magnet',name:'Credit Magnet',desc:'Bonus credits from destroyed objects',baseCost:150,costMult:1.7,level:0,effect:function(){}},
    {id:'chain',name:'Chain Reaction',desc:'Destroyed objects damage nearby ones',baseCost:300,costMult:2.0,level:0,maxLevel:10,effect:function(){}},
    {id:'speed',name:'Slow Field',desc:'Slows down scrolling objects',baseCost:250,costMult:1.8,level:0,maxLevel:10,effect:function(){}},
    {id:'size',name:'Big Targets',desc:'Objects spawn larger (easier to tap)',baseCost:75,costMult:1.5,level:0,maxLevel:10,effect:function(){}}
  ];

  function getCost(u){return Math.floor(u.baseCost*Math.pow(u.costMult,u.level))}
  function formatNum(n){
    if(n>=1e9)return(n/1e9).toFixed(1)+'B';
    if(n>=1e6)return(n/1e6).toFixed(1)+'M';
    if(n>=1e3)return(n/1e3).toFixed(1)+'K';
    return ''+n;
  }

  // LAUNCH
  window.launchGame = function(e){
    if(e) e.preventDefault();
    if(launched) return;
    launched = true;
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('game-container').style.display = 'flex';
    initCanvas();
    initStars();
    renderUpgrades();
    updateHUD();
    gameRunning = true;
    requestAnimationFrame(gameLoop);
    setInterval(autoTick, 1000);
    setInterval(spawnObject, 900);
  };

  wireStartButton();
  document.getElementById('start-btn').addEventListener('click', function(e){
    if(!launched) launchGame(e);
  });

  // SHOP TOGGLE
  window.toggleShop = function(){
    shopOpen = !shopOpen;
    document.getElementById('shop-panel').classList.toggle('open', shopOpen);
    document.getElementById('shop-backdrop').classList.toggle('active', shopOpen);
  };

  // Backdrop close
  document.getElementById('shop-backdrop').addEventListener('click', function(){window.toggleShop();});

  // Shop toggle button
  document.getElementById('shop-toggle').addEventListener('click', function(e){e.stopPropagation();window.toggleShop();});

  function initCanvas(){
    bgCanvas = document.getElementById('bgCanvas');
    bgCtx = bgCanvas.getContext('2d');
    gameCanvas = document.getElementById('gameCanvas');
    gameCtx = gameCanvas.getContext('2d');
    dpr = window.devicePixelRatio || 1;
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', function(){setTimeout(resizeCanvas,300)});

    // One input path for iPhone/Safari and desktop; prevents duplicate touch + click hits.
    gameCanvas.addEventListener('pointerdown', function(e){
      if(e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault();
      var rect = gameCanvas.getBoundingClientRect();
      handleHit(e.clientX - rect.left, e.clientY - rect.top);
    }, {passive:false});

    // Prevent pull-to-refresh only on game area
    document.getElementById('game-area').addEventListener('touchmove', function(e){e.preventDefault()}, {passive:false});
  }

  function resizeCanvas(){
    var area = document.getElementById('game-area');
    if(!area) return;
    canvasW = area.clientWidth;
    canvasH = area.clientHeight;
    if(canvasW < 1) canvasW = window.innerWidth;
    if(canvasH < 1) canvasH = window.innerHeight;
    bgCanvas.width = canvasW * dpr;
    bgCanvas.height = canvasH * dpr;
    bgCanvas.style.width = canvasW + 'px';
    bgCanvas.style.height = canvasH + 'px';
    bgCtx.setTransform(dpr,0,0,dpr,0,0);
    gameCanvas.width = canvasW * dpr;
    gameCanvas.height = canvasH * dpr;
    gameCanvas.style.width = canvasW + 'px';
    gameCanvas.style.height = canvasH + 'px';
    gameCtx.setTransform(dpr,0,0,dpr,0,0);
    initStars();
  }

  function initStars(){
    stars = [];
    for(var i=0;i<120;i++){
      stars.push({x:Math.random()*canvasW,y:Math.random()*canvasH,
        size:Math.random()*2+0.5,speed:Math.random()*0.5+0.2,
        brightness:Math.random()*0.5+0.5});
    }
  }

  var objectTypes = [
    {name:'asteroid',color:'#888',hp:3,size:28,credits:5,shape:'rock'},
    {name:'ice',color:'#88ddff',hp:2,size:24,credits:3,shape:'crystal'},
    {name:'gold',color:'#ffcc00',hp:5,size:26,credits:15,shape:'rock'},
    {name:'alien',color:'#66ff66',hp:8,size:34,credits:25,shape:'ship'},
    {name:'boss',color:'#ff3366',hp:50,size:60,credits:100,shape:'boss'}
  ];

  function spawnObject(){
    if(!gameRunning) return;
    var typeIndex, r = Math.random();
    if(r<0.45) typeIndex=0;
    else if(r<0.70) typeIndex=1;
    else if(r<0.85) typeIndex=2;
    else if(r<0.95) typeIndex=3;
    else typeIndex=0;
    if(waveProgress>=waveTarget-1 && wave%5===0) typeIndex=4;
    var type = objectTypes[typeIndex];
    var sizeU = findUpgrade('size');
    var sizeMod = 1+(sizeU.level*0.1);
    var size = type.size*sizeMod;
    var hpScale = 1+(wave-1)*0.3;
    var speedU = findUpgrade('speed');
    var speedMod = Math.max(0.3,1-speedU.level*0.07);
    objects.push({
      x:Math.random()*(canvasW-size*2)+size, y:-size, size:size,
      hp:Math.ceil(type.hp*hpScale), maxHp:Math.ceil(type.hp*hpScale),
      speed:(Math.random()*1.2+0.8+wave*0.08)*speedMod,
      credits:Math.ceil(type.credits*(1+(wave-1)*0.2)),
      color:type.color, shape:type.shape, name:type.name,
      rotation:Math.random()*Math.PI*2, rotSpeed:(Math.random()-0.5)*0.04
    });
  }

  function findUpgrade(id){
    for(var i=0;i<upgrades.length;i++){if(upgrades[i].id===id)return upgrades[i];}
    return {level:0};
  }

  // TOUCH
  function onTouch(e){
    e.preventDefault();
    var rect = gameCanvas.getBoundingClientRect();
    for(var i=0;i<e.changedTouches.length;i++){
      var t = e.changedTouches[i];
      var mx = (t.clientX - rect.left)*(canvasW/rect.width);
      var my = (t.clientY - rect.top)*(canvasH/rect.height);
      handleHit(mx,my);
    }
  }

  // CLICK (desktop)
  function onCanvasClick(e){
    var rect = gameCanvas.getBoundingClientRect();
    var mx = (e.clientX-rect.left)*(canvasW/rect.width);
    var my = (e.clientY-rect.top)*(canvasH/rect.height);
    handleHit(mx,my);
  }

  function handleHit(mx,my){
    var hit = false;
    var isMobile = window.innerWidth<=768;
    var hitBonus = isMobile?15:0;
    for(var i=objects.length-1;i>=0;i--){
      var obj = objects[i];
      var dx = mx-obj.x, dy = my-obj.y;
      var hitR = obj.size+hitBonus;
      if(dx*dx+dy*dy < hitR*hitR){
        var dmg = clickDamage;
        var critU = findUpgrade('crit');
        if(Math.random()<critU.level*0.04){
          dmg*=5;
          spawnClickText(mx,my,'CRIT! '+dmg,'#ff3366');
        } else {
          spawnClickText(mx,my,''+dmg,'#00e5ff');
        }
        obj.hp -= dmg;
        spawnParticles(mx,my,obj.color,5);
        if(obj.hp<=0) destroyObject(obj,i);
        combo++;
        clearTimeout(comboTimer);
        comboTimer = setTimeout(function(){combo=0;updateCombo()},2000);
        updateCombo();
        hit = true;
        break;
      }
    }
    if(!hit) spawnParticles(mx,my,'#334',3);
  }

  function destroyObject(obj,index){
    var magnetU = findUpgrade('magnet');
    var magnetBonus = 1+magnetU.level*0.15;
    var comboBonus = 1+Math.min(combo,50)*0.05;
    var earned = Math.ceil(obj.credits*creditMultiplier*prestigeMultiplier*magnetBonus*comboBonus);
    credits+=earned; totalCredits+=earned; totalDestroyed++; waveProgress++;
    spawnParticles(obj.x,obj.y,obj.color,12);
    spawnClickText(obj.x,obj.y-20,'+'+earned,'#ffcc00');

    var chainU = findUpgrade('chain');
    if(chainU.level>0){
      var chainDmg = Math.ceil(clickDamage*chainU.level*0.5);
      var chainRange = 100+chainU.level*15;
      for(var j=objects.length-1;j>=0;j--){
        var other = objects[j];
        if(other===obj) continue;
        var ddx=other.x-obj.x, ddy=other.y-obj.y;
        if(ddx*ddx+ddy*ddy<chainRange*chainRange){
          other.hp-=chainDmg;
          spawnParticles(other.x,other.y,'#ffaa00',3);
          if(other.hp<=0) destroyObject(other,j);
        }
      }
    }
    var idx = objects.indexOf(obj);
    if(idx>-1) objects.splice(idx,1);
    if(waveProgress>=waveTarget){
      wave++; waveProgress=0; waveTarget=Math.floor(10+wave*3);
      announceWave();
    }
    updateHUD(); renderUpgrades();
  }

  function autoTick(){
    if(!gameRunning||autoDP<=0) return;
    for(var i=objects.length-1;i>=0;i--){
      objects[i].hp-=autoDP;
      spawnParticles(objects[i].x,objects[i].y,'#00aaff',2);
      if(objects[i].hp<=0) destroyObject(objects[i],i);
    }
    updateHUD();
  }

  function announceWave(){
    var el=document.getElementById('wave-announce');
    el.textContent='WAVE '+wave;
    el.style.opacity=1;
    setTimeout(function(){el.style.opacity=0},2000);
  }

  function updateCombo(){
    var el=document.getElementById('combo-display');
    if(combo>1){
      el.textContent='COMBO x'+combo;
      el.classList.add('active');
      el.style.fontSize=Math.min(22+combo*0.5,40)+'px';
    } else { el.classList.remove('active'); }
  }

  function updateHUD(){
    document.getElementById('credits').textContent=formatNum(Math.floor(credits));
    document.getElementById('total-credits').textContent=formatNum(Math.floor(totalCredits));
    document.getElementById('dps').textContent=formatNum(autoDP);
    document.getElementById('wave').textContent=wave;
    document.getElementById('destroyed').textContent=formatNum(totalDestroyed);
    document.getElementById('prestige-info').textContent=
      totalCredits>=10000
        ? 'Ready! '+prestigeMultiplier.toFixed(1)+'x -> '+(prestigeMultiplier+0.5).toFixed(1)+'x'
        : 'Need '+formatNum(10000-Math.floor(totalCredits))+' more total credits';
  }

  function renderUpgrades(){
    var list=document.getElementById('upgrade-list');
    list.innerHTML='';
    for(var i=0;i<upgrades.length;i++){
      (function(idx){
        var u=upgrades[idx];
        var cost=getCost(u);
        var canBuy=credits>=cost&&(!u.maxLevel||u.level<u.maxLevel);
        var maxed=u.maxLevel&&u.level>=u.maxLevel;
        var btn=document.createElement('div');
        btn.className='upgrade-btn'+(canBuy?'':' disabled');
        btn.innerHTML=
          '<div class="upgrade-name">'+u.name+'</div>'+
          '<div class="upgrade-desc">'+u.desc+'</div>'+
          '<div class="upgrade-cost">'+(maxed?'MAXED':'Cost: '+formatNum(cost))+'</div>'+
          '<div class="upgrade-level">Lv '+u.level+(u.maxLevel?'/'+u.maxLevel:'')+'</div>';
        if(canBuy){
          btn.addEventListener('touchend',function(e){e.preventDefault();e.stopPropagation();buyUpgrade(idx)});
          btn.addEventListener('click',function(e){e.stopPropagation();buyUpgrade(idx)});
        }
        list.appendChild(btn);
      })(i);
    }
  }

  function buyUpgrade(index){
    var u=upgrades[index];
    var cost=getCost(u);
    if(credits<cost) return;
    if(u.maxLevel&&u.level>=u.maxLevel) return;
    credits-=cost; u.level++; u.effect();
    updateHUD(); renderUpgrades();
  }

  window.prestige = function(){
    if(totalCredits<10000) return;
    prestigeLevel++; prestigeMultiplier+=0.5;
    credits=0;totalCredits=0;totalDestroyed=0;
    clickDamage=1;creditMultiplier=1;autoDP=0;combo=0;
    wave=1;waveProgress=0;waveTarget=10;objects=[];
    for(var i=0;i<upgrades.length;i++) upgrades[i].level=0;
    updateHUD(); renderUpgrades();
    var el=document.getElementById('wave-announce');
    el.textContent='PRESTIGE '+prestigeLevel+' '+prestigeMultiplier.toFixed(1)+'x';
    el.style.opacity=1;
    setTimeout(function(){el.style.opacity=0},3000);
  };

  // PARTICLES
  function spawnParticles(x,y,color,count){
    for(var i=0;i<count;i++){
      particles.push({x:x,y:y,
        vx:(Math.random()-0.5)*7,vy:(Math.random()-0.5)*7,
        size:Math.random()*3.5+1.5,color:color,life:1,
        decay:Math.random()*0.03+0.02});
    }
  }

  function spawnClickText(x,y,text,color){
    var el=document.createElement('div');
    el.className='click-text';
    el.textContent=text;
    el.style.left=x+'px';
    el.style.top=y+'px';
    el.style.color=color;
    el.style.textShadow='0 0 10px '+color;
    document.getElementById('game-area').appendChild(el);
    setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},700);
  }

  // DRAWING
  function drawStars(){
    bgCtx.fillStyle='#0a0a1a';
    bgCtx.fillRect(0,0,canvasW,canvasH);
    for(var i=0;i<stars.length;i++){
      var s=stars[i];
      s.y+=s.speed;
      if(s.y>canvasH){s.y=0;s.x=Math.random()*canvasW;}
      bgCtx.fillStyle='rgba(200,220,255,'+s.brightness+')';
      bgCtx.beginPath();
      bgCtx.arc(s.x,s.y,s.size,0,Math.PI*2);
      bgCtx.fill();
    }
  }

  function drawObjects(){
    gameCtx.clearRect(0,0,canvasW,canvasH);
    for(var i=objects.length-1;i>=0;i--){
      var obj=objects[i];
      obj.y+=obj.speed;
      obj.rotation+=obj.rotSpeed;
      if(obj.y>canvasH+obj.size*2){objects.splice(i,1);continue;}
      gameCtx.save();
      gameCtx.translate(obj.x,obj.y);
      gameCtx.rotate(obj.rotation);
      gameCtx.shadowBlur=12;
      gameCtx.shadowColor=obj.color;
      if(obj.shape==='rock') drawRock(obj);
      else if(obj.shape==='crystal') drawCrystal(obj);
      else if(obj.shape==='ship') drawShip(obj);
      else if(obj.shape==='boss') drawBoss(obj);
      gameCtx.restore();
      if(obj.hp<obj.maxHp){
        var bW=obj.size*1.5,bH=5,bX=obj.x-bW/2,bY=obj.y-obj.size-10;
        gameCtx.fillStyle='#222';
        gameCtx.fillRect(bX,bY,bW,bH);
        var pct=obj.hp/obj.maxHp;
        gameCtx.fillStyle=pct>0.5?'#66ff66':pct>0.25?'#ffaa00':'#ff3333';
        gameCtx.fillRect(bX,bY,bW*pct,bH);
      }
    }
  }

  function drawRock(obj){
    gameCtx.fillStyle=obj.color;
    gameCtx.beginPath();
    for(var i=0;i<7;i++){
      var a=(i/7)*Math.PI*2;
      var r=obj.size*(0.7+Math.sin(i*3.7)*0.3);
      i===0?gameCtx.moveTo(Math.cos(a)*r,Math.sin(a)*r):gameCtx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
    }
    gameCtx.closePath();gameCtx.fill();
    gameCtx.strokeStyle='rgba(255,255,255,0.2)';gameCtx.lineWidth=1;gameCtx.stroke();
  }

  function drawCrystal(obj){
    gameCtx.fillStyle=obj.color;
    gameCtx.beginPath();
    for(var i=0;i<6;i++){
      var a=(i/6)*Math.PI*2-Math.PI/2;
      var r=i%2===0?obj.size:obj.size*0.5;
      i===0?gameCtx.moveTo(Math.cos(a)*r,Math.sin(a)*r):gameCtx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
    }
    gameCtx.closePath();gameCtx.fill();
    gameCtx.strokeStyle='rgba(255,255,255,0.4)';gameCtx.lineWidth=1.5;gameCtx.stroke();
  }

  function drawShip(obj){
    gameCtx.fillStyle=obj.color;
    gameCtx.beginPath();
    gameCtx.moveTo(0,-obj.size);
    gameCtx.lineTo(obj.size*0.7,obj.size*0.6);
    gameCtx.lineTo(0,obj.size*0.3);
    gameCtx.lineTo(-obj.size*0.7,obj.size*0.6);
    gameCtx.closePath();gameCtx.fill();
    gameCtx.strokeStyle='rgba(255,255,255,0.3)';gameCtx.lineWidth=1.5;gameCtx.stroke();
    gameCtx.fillStyle='#ff6600';gameCtx.shadowColor='#ff3300';gameCtx.shadowBlur=18;
    gameCtx.beginPath();gameCtx.arc(0,obj.size*0.5,4,0,Math.PI*2);gameCtx.fill();
  }

  function drawBoss(obj){
    gameCtx.fillStyle=obj.color;
    gameCtx.beginPath();gameCtx.arc(0,0,obj.size*0.6,0,Math.PI*2);gameCtx.fill();
    for(var i=0;i<8;i++){
      var a=(i/8)*Math.PI*2;
      gameCtx.beginPath();
      gameCtx.moveTo(Math.cos(a)*obj.size*0.5,Math.sin(a)*obj.size*0.5);
      gameCtx.lineTo(Math.cos(a)*obj.size,Math.sin(a)*obj.size);
      gameCtx.lineWidth=4;gameCtx.strokeStyle=obj.color;gameCtx.stroke();
    }
    gameCtx.fillStyle='#fff';gameCtx.shadowBlur=0;
    gameCtx.beginPath();gameCtx.arc(0,0,obj.size*0.2,0,Math.PI*2);gameCtx.fill();
    gameCtx.fillStyle='#111';
    gameCtx.beginPath();gameCtx.arc(0,0,obj.size*0.1,0,Math.PI*2);gameCtx.fill();
  }

  function drawParticles(){
    for(var i=particles.length-1;i>=0;i--){
      var p=particles[i];
      p.x+=p.vx;p.y+=p.vy;p.life-=p.decay;p.vx*=0.97;p.vy*=0.97;
      if(p.life<=0){particles.splice(i,1);continue;}
      gameCtx.fillStyle=p.color;
      gameCtx.globalAlpha=p.life;
      gameCtx.beginPath();gameCtx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);gameCtx.fill();
      gameCtx.globalAlpha=1;
    }
  }

  function gameLoop(){
    drawStars();drawObjects();drawParticles();
    requestAnimationFrame(gameLoop);
  }

})();
</script>
</body>
</html>
